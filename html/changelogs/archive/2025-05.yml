2025-05-23:
  AndroBetel:
  - rscadd: Heirloom weapon preference to character creation. At the start of the
      round, one of the marines (not counting pltco) will have their gun spawn in
      the armory.
  - rscadd: Humanitarian Daily Ration for GMs to spawn
  BonniePandora:
  - bugfix: M07 grenades can no longer kill people
  - bugfix: M108 canister grenades are now the right caliber
  - balance: Tweaks the claymores to be much fairer weapons, no longer having the
      potential to wipe out most of a platoon/section at full health in one go.
  - code_imp: Sanatizes the mine code somewhat
  - qol: High CQC skills will only floor someone trying to heal you if they aren't
      of the same faction _and_ you're on harm intent
  - balance: As above, this is also something pertaining to balance
  - rscadd: WY security have a chance to spawn with a corporate cap instead of a helmet
  The32bitguy:
  - rscadd: Internal Bleeding now instead starts as Arterial Bleeding, that sprays
      blood with a visual, audible and chatlog indication
  - qol: Arterial Bleeds now show on help-intent self examine.
  - balance: Arterial Bleeds can have the spraying component mitigated by applying
      gauze or a trauma kit, turning them into a slower version of the old Internal
      Bleeding effect.
  - balance: Iron Pills have 7.5u of sugar in them.
  - balance: The IB treatment step now takes 7.5 seconds instead of 5 seconds.
  - soundadd: The sound for the above blood spray.
  - imageadd: The icons for each possible direction of the blood spray, to avoid overlays
      inheriting the turfs direction for their icon, due to blood optimization.
  Yorkoh:
  - qol: swapped the Create Humans - ERT default selection around in their pop ups
