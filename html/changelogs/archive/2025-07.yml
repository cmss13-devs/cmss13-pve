2025-07-03:
  BonniePandora:
  - bugfix: Crew Manifest works for non-USCM factions
  - ui: Removes a few unused buttons on the main menu
  - balance: 9mm on the whole has slightly higher AP than before in both pistol &
      SMG form. Damage equalised between the two forms too
  - balance: .45 has lost it's positive AP, now having (slightly) worse than 9mm but
      with more damage to make up for it
  - balance: The hipower/HG-45 has lost it's insane AP value of 25, now dialled back
      to a more reasonable 10 for the lesser damage it dealt per bullet
  - balance: .44 rounds deal slightly less damage but have AP on par with the HG-45's
      rounds, .357 does less damage but has slightly higher AP & bullet-speed
  - balance: The nagant-revolver calibre used by the UPP revolver has been adjusted,
      sitting between ,44 & .357 in terms of damage & AP
  - balance: The MP7's rounds do less damage but have AP now
  - balance: The PPSH type rounds have been brought closer together in terms of stats
  - balance: The Viper 9/M39 once more uses the actual SMG rounds in it's magazines
  - rscadd: The M10's squad optic visor, M56 gunsight eyepiece, M42 scout sight, M49A
      battle-sight, Mk4 Battlemedic sight, M5 camera gear and all relevant subtypes
      now function as the a means to see allied-faction HUD icons.
  - rscadd: The M42A, M42C, UPP commando NVGs and M56 gunsight optic now offer corresponding
      faction HUDs, for those who run those kinds of eyepieces without a helmet. Many
      of them will also offer a camera for OW units to observe through the wearer
  - rscadd: Faction subtypes of the M5 cam-gear, PMC, TWE & UPP
  - rscadd: Synthetic headset subtypes for PMC, UPP & FORECON ones, bringing them
      in-line with the USCM one
  - rscadd: Subtypes of the crew monitor tablet, in UPP & PMC flavours
  - rscadd: CMB faction HUD
  - qol: Many HUD sources will give the squad HUD info of allied factions, so USCM
      can see USASF & Army and PMC can see the TWE/WY ones
  - qol: The USCM medical vendors have recieved a new category for a combi squad &
      medical HUD eyepiece. The USCM LT of the Garrow recieves one in their office
      too
  Pandora029:
  - balance: The M402 mortar & rangefinding functions can now be used on the ship
      map, so long as the ceiling isn't too tough
  - balance: Laser designators can now laze targets that are under a roof, so long
      as the user themselves are in the open
